# nginx site for the DocExtract demo. Installed by ops/deploy.sh as /etc/nginx/sites-available/docextract
# with __DOMAIN__ and __PORT__ substituted. Assumes a certbot certificate at /etc/letsencrypt/live/__DOMAIN__.

limit_req_zone $binary_remote_addr zone=docextract_upload:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    # "listen ... http2" rather than "http2 on": Ubuntu 24.04 ships nginx 1.24, which predates the directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # The assessment requires 100 MB+ PDFs. Uploads stream straight through to the app (no
    # buffering to disk here) and processing is asynchronous, so only the upload itself is a
    # long request.
    client_max_body_size 256m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/docextract-access.log;
    error_log /var/log/nginx/docextract-error.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static downloads (the submission archive). Longest-prefix match, so it wins over "/".
    location /submission/ {
        alias /var/www/submission/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
    location = /api/documents {
        limit_req zone=docextract_upload burst=3 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
